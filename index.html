<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nightly Bot</title>
<meta name="theme-color" content="#0f172a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root { --bg:#0f172a; --card:#1e293b; --line:#334155; --txt:#e2e8f0; --dim:#94a3b8; --up:#34d399; --down:#f87171; --acc:#38bdf8; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--txt); font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; padding:16px 16px 40px; max-width:640px; margin-inline:auto; }
  h1 { font-size:18px; margin:0; }
  h2 { font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:var(--dim); margin:24px 0 8px; }
  .top { display:flex; justify-content:space-between; align-items:center; gap:8px; }
  button { background:var(--card); color:var(--txt); border:1px solid var(--line); border-radius:10px; padding:8px 12px; font:inherit; }
  .card { background:var(--card); border-radius:14px; padding:14px; margin-bottom:10px; }
  .big { font-size:34px; font-weight:700; }
  .dim { color:var(--dim); font-size:13px; }
  .up { color:var(--up); } .down { color:var(--down); }
  .row { display:flex; justify-content:space-between; gap:10px; padding:8px 0; border-bottom:1px solid var(--line); }
  .row:last-child { border-bottom:0; }
  .tag { font-size:11px; padding:2px 8px; border-radius:99px; background:#0b3a53; color:var(--acc); }
  .tag.morning { background:#4a3a0b; color:#fbbf24; }
  .warn { font-size:12px; color:var(--dim); border-left:3px solid var(--line); padding-left:10px; margin-top:10px; }
  svg { width:100%; height:120px; display:block; }
  .err { color:var(--down); }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px; }
  .chips button { padding:5px 10px; font-size:13px; border-radius:99px; }
  .chips button.on { background:#0b3a53; border-color:var(--acc); color:var(--acc); }
  .key { font-size:12px; display:flex; gap:12px; margin-top:4px; }
</style>
</head>
<body>
<div class="top"><h1>Nightly Bot <span class="dim">· paper trading</span></h1><button id="refresh">Refresh</button></div>
<h2>Live prices <span class="dim" id="liveStatus"></span></h2>
<div class="card" id="live"><p class="dim">Loading prices…</p></div>
<h2>Price chart</h2>
<div class="card" id="chartBox"><p class="dim">Loading chart…</p></div>
<h2>Markets open now</h2>
<div class="card" id="sessions"></div>
<div id="app"><p class="dim">Loading…</p></div>

<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = (n) => (n < 0 ? '-' : '') + '$' + Math.abs(n).toLocaleString(undefined, {minimumFractionDigits:2, maximumFractionDigits:2});
const signed = (n) => (n >= 0 ? '+' : '-') + '$' + Math.abs(n).toFixed(2);
const cls = (n) => (n >= 0 ? 'up' : 'down');
const when = (iso) => new Date(iso).toLocaleString(undefined, {weekday:'short', day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'});

function chart(runs) {
  if (runs.length < 2) return '<p class="dim">The chart appears after the second run.</p>';
  const v = runs.map((r) => r.equity), min = Math.min(...v), max = Math.max(...v), span = max - min || 1;
  const pts = v.map((y, i) => `${(i / (v.length - 1)) * 300},${110 - ((y - min) / span) * 100}`).join(' ');
  const up = v[v.length - 1] >= v[0];
  return `<svg viewBox="0 0 300 120" preserveAspectRatio="none" role="img" aria-label="Equity over runs">
    <polyline points="${pts}" fill="none" stroke="${up ? '#34d399' : '#f87171'}" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>
    <div class="row dim"><span>${money(min)}</span><span>${money(max)}</span></div>`;
}

function render(r) {
  const lr = r.last_run, accts = Object.values(r.accounts);
  const runs = r.runs.slice().reverse().slice(0, 12);
  const bt = Object.entries(r.backtest);
  $('#app').innerHTML = `
    <div class="card">
      <div class="dim">Paper equity · last run ${esc(when(lr.ts))} <span class="tag ${esc(lr.label)}">${esc(lr.label)}</span></div>
      <div class="big">${money(r.equity)}</div>
      <div><span class="${cls(r.return_pct)}">${r.return_pct >= 0 ? '+' : ''}${r.return_pct}%</span> <span class="dim">since ${esc(when(r.started))} · last run <span class="${cls(lr.change)}">${signed(lr.change)}</span></span></div>
      ${chart(r.runs)}
      ${lr.errors && lr.errors.length ? `<p class="err">Problem in last run: ${esc(lr.errors.join('; '))}</p>` : ''}
    </div>

    <h2>Run history</h2>
    <div class="card">${runs.map((x) => `<div class="row"><span><span class="tag ${esc(x.label)}">${esc(x.label)}</span> <span class="dim">${esc(when(x.ts))}</span></span><span>${x.new_trades} trades · <span class="${cls(x.change)}">${signed(x.change)}</span></span></div>`).join('')}</div>

    <h2>Strategies (live paper)</h2>
    <div class="card">${accts.map((a) => `<div class="row"><span>${esc(a.name)}<br><span class="dim">${esc(a.symbol)} · ${a.trades} trades${a.win_rate != null ? ' · ' + a.win_rate + '% wins' : ''}${a.open ? ' · open ' + esc(a.open.side) : ''}</span></span><span class="${cls(a.equity - 1000)}">${money(a.equity)}</span></div>`).join('')}</div>

    <h2>Latest trades</h2>
    <div class="card">${r.trades.length ? r.trades.slice().reverse().slice(0, 15).map((t) => `<div class="row"><span>${esc(t.key.replace('|', ' · '))}<br><span class="dim">${esc(t.side)} · ${esc(t.reason)} · ${esc(when(new Date(t.exit_ts).toISOString()))}</span></span><span class="${cls(t.pnl)}">${signed(t.pnl)}</span></div>`).join('') : '<p class="dim">No finished trades yet. That is normal early on, these strategies trade rarely.</p>'}</div>

    <h2>Backtest on recent history</h2>
    <div class="card">${bt.map(([k, b]) => `<div class="row"><span>${esc(k.replace('|', ' · '))}<br><span class="dim">${b.trades} trades${b.win_rate != null ? ' · ' + b.win_rate + '% wins' : ''} · ${b.days} days</span></span><span class="${cls(b.return_pct)}">${b.return_pct >= 0 ? '+' : ''}${b.return_pct}%</span></div>`).join('')}
      <div class="warn">Backtests only show what would have happened in the past. A few weeks of data is too little to trust, so keep paper trading before you risk any real money.</div></div>
    <p class="dim">Paper money only. Updated ${esc(when(r.updated))}.</p>`;
}

/* ---------- live prices + market sessions ---------- */
const WATCH = ['BTCUSDT', 'ETHUSDT', 'SOLUSDT', 'BNBUSDT', 'XRPUSDT'];
const SESSIONS = [['Sydney', 22, 7], ['Tokyo', 0, 9], ['London', 8, 17], ['New York', 13, 22]]; // UTC hours, standard time
let REPORT = null, PRICES = {}, LIVE_OK = null, LIVE_AT = null;

const px = (p) => p >= 1000 ? p.toLocaleString(undefined, {minimumFractionDigits:2, maximumFractionDigits:2}) : p >= 1 ? p.toFixed(3) : p.toFixed(5);
const localHour = (h) => new Date(Date.UTC(2026, 0, 1, h)).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});

function forexClosedForWeekend(d) {
  const day = d.getUTCDay(), hr = d.getUTCHours() + d.getUTCMinutes() / 60;
  return (day === 5 && hr >= 22) || day === 6 || (day === 0 && hr < 22);
}
function sessionOpen(s, d) {
  if (forexClosedForWeekend(d)) return false;
  const hr = d.getUTCHours() + d.getUTCMinutes() / 60, a = s[1], b = s[2];
  return a < b ? hr >= a && hr < b : hr >= a || hr < b;
}

function paintLive() {
  const rows = WATCH.filter((s) => PRICES[s]).map((s) => {
    const q = PRICES[s];
    return `<div class="row"><span>${esc(s.replace('USDT', ''))}<span class="dim"> / USDT</span></span><span>${px(q.p)} <span class="${cls(q.ch)}">${q.ch >= 0 ? '+' : ''}${q.ch.toFixed(2)}%</span></span></div>`;
  }).join('');
  let open = '';
  if (REPORT) {
    const list = Object.values(REPORT.accounts).filter((a) => a.open && PRICES[a.symbol]);
    open = `<div class="dim" style="margin-top:10px">Open paper trades</div>` + (list.length ? list.map((a) => {
      const d = a.open.side === 'long' ? 1 : -1, pct = ((PRICES[a.symbol].p - a.open.entry) / a.open.entry) * 100 * d;
      return `<div class="row"><span>${esc(a.name)}<br><span class="dim">${esc(a.symbol)} · ${esc(a.open.side)} from ${px(a.open.entry)}</span></span><span class="${cls(pct)}">${pct >= 0 ? '+' : ''}${pct.toFixed(2)}%</span></div>`;
    }).join('') : '<p class="dim">None right now.</p>');
  }
  $('#live').innerHTML = (rows || '<p class="dim">No prices yet.</p>') + open;
  $('#liveStatus').textContent = LIVE_OK === false ? '· cannot reach price feed, retrying' : LIVE_AT ? '· updates every 5s' : '';

  const now = new Date(), weekend = forexClosedForWeekend(now);
  $('#sessions').innerHTML =
    `<div class="row"><span>Crypto (Binance)</span><span class="up">Open 24/7</span></div>` +
    `<div class="row"><span>Deriv synthetics</span><span class="up">Open 24/7</span></div>` +
    SESSIONS.map((s) => {
      const o = sessionOpen(s, now);
      return `<div class="row"><span>${s[0]} forex<br><span class="dim">${localHour(s[1])} - ${localHour(s[2])} your time</span></span><span class="${o ? 'up' : 'down'}">${o ? 'Open' : 'Closed'}</span></div>`;
    }).join('') +
    `<div class="warn">${weekend ? 'Forex is closed for the weekend. ' : ''}Session hours are standard times and shift by an hour with daylight saving in Europe and the US.</div>`;
}

async function pull() {
  if (document.hidden) return;
  try {
    const url = 'https://data-api.binance.vision/api/v3/ticker/24hr?symbols=' + encodeURIComponent(JSON.stringify(WATCH));
    const res = await fetch(url);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    (await res.json()).forEach((x) => { PRICES[x.symbol] = {p: +x.lastPrice, ch: +x.priceChangePercent}; });
    LIVE_OK = true; LIVE_AT = new Date();
  } catch (e) { LIVE_OK = false; }
  paintLive();
}

/* ---------- price chart with trend and overbought/oversold (own calculation) ---------- */
let CH_SYM = 'BTCUSDT', CH_TF = '1h', CH_DATA = null, CH_ERR = false;
const TFS = ['15m', '1h', '4h', '1d'];

function emaArr(v, n) { const k = 2 / (n + 1); let e = null; return v.map((x, i) => { e = e === null ? x : x * k + e * (1 - k); return i >= n - 1 ? e : null; }); }
function rsiLast(c, n = 14) {
  if (c.length <= n) return null;
  let g = 0, l = 0;
  for (let i = 1; i <= n; i++) { const d = c[i] - c[i - 1]; g += Math.max(d, 0); l += Math.max(-d, 0); }
  g /= n; l /= n;
  for (let i = n + 1; i < c.length; i++) { const d = c[i] - c[i - 1]; g = (g * (n - 1) + Math.max(d, 0)) / n; l = (l * (n - 1) + Math.max(-d, 0)) / n; }
  return l === 0 ? 100 : 100 - 100 / (1 + g / l);
}

function paintChart() {
  const chips = `<div class="chips">${WATCH.map((s) => `<button data-sym="${s}" class="${s === CH_SYM ? 'on' : ''}">${s.replace('USDT', '')}</button>`).join('')}</div>
    <div class="chips">${TFS.map((t) => `<button data-tf="${t}" class="${t === CH_TF ? 'on' : ''}">${t}</button>`).join('')}</div>`;
  let body = '<p class="dim">Loading chart…</p>';
  if (CH_ERR && !CH_DATA) body = '<p class="err">Cannot reach the price feed, retrying.</p>';
  if (CH_DATA) {
    const c = CH_DATA, e20 = emaArr(c, 20), e50 = emaArr(c, 50), last = c[c.length - 1];
    const vals = c.concat(e20.filter((x) => x !== null), e50.filter((x) => x !== null));
    const min = Math.min(...vals), max = Math.max(...vals), span = max - min || 1;
    const line = (a) => a.map((y, i) => y === null ? null : `${(i / (a.length - 1)) * 300},${130 - ((y - min) / span) * 120}`).filter(Boolean).join(' ');
    const up = last >= c[0], r = rsiLast(c);
    const a20 = e20[e20.length - 1], a50 = e50[e50.length - 1];
    let trend = 'Sideways';
    if (a20 !== null && a50 !== null) trend = a20 > a50 && last > a20 ? 'Uptrend' : a20 < a50 && last < a20 ? 'Downtrend' : 'Mixed';
    const str = a20 !== null && a50 !== null ? (Math.abs(a20 - a50) / last * 100).toFixed(2) + '%' : '-';
    const zone = r === null ? '-' : r >= 70 ? 'Overbought' : r <= 30 ? 'Oversold' : 'Neutral';
    body = `<svg viewBox="0 0 300 140" preserveAspectRatio="none" role="img" aria-label="${esc(CH_SYM)} price chart">
        <polyline points="${line(e50)}" fill="none" stroke="#38bdf8" stroke-width="1.5" vector-effect="non-scaling-stroke"/>
        <polyline points="${line(e20)}" fill="none" stroke="#fbbf24" stroke-width="1.5" vector-effect="non-scaling-stroke"/>
        <polyline points="${line(c)}" fill="none" stroke="${up ? '#34d399' : '#f87171'}" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>
      <div class="row dim"><span>${px(min)}</span><span>${px(max)}</span></div>
      <div class="key dim"><span style="color:${up ? '#34d399' : '#f87171'}">Price</span><span style="color:#fbbf24">EMA 20</span><span style="color:#38bdf8">EMA 50</span></div>
      <div class="row"><span>Trend</span><span class="${trend === 'Uptrend' ? 'up' : trend === 'Downtrend' ? 'down' : ''}">${trend} <span class="dim">(gap ${str})</span></span></div>
      <div class="row"><span>RSI 14</span><span class="${zone === 'Overbought' ? 'down' : zone === 'Oversold' ? 'up' : ''}">${r === null ? '-' : r.toFixed(0)} <span class="dim">${zone}</span></span></div>
      <div class="warn">My own simple calculation from Binance prices (last 120 candles). It is not MarketMilk data and not advice.</div>`;
  }
  $('#chartBox').innerHTML = chips + body;
}

async function pullChart() {
  if (document.hidden) return;
  try {
    const url = `https://data-api.binance.vision/api/v3/klines?symbol=${CH_SYM}&interval=${CH_TF}&limit=120`;
    const res = await fetch(url);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    CH_DATA = (await res.json()).map((k) => +k[4]); CH_ERR = false;
  } catch (e) { CH_ERR = true; }
  paintChart();
}

$('#chartBox').addEventListener('click', (ev) => {
  const b = ev.target.closest('button'); if (!b) return;
  if (b.dataset.sym) CH_SYM = b.dataset.sym;
  if (b.dataset.tf) CH_TF = b.dataset.tf;
  CH_DATA = null; paintChart(); pullChart();
});

async function load() {
  try {
    const res = await fetch('data/report.json?t=' + Date.now(), {cache: 'no-store'});
    if (!res.ok) throw new Error('HTTP ' + res.status);
    REPORT = await res.json();
    render(REPORT);
    paintLive();
  } catch (e) {
    $('#app').innerHTML = '<div class="card"><p>No report yet.</p><p class="dim">The first one appears after the bot runs for the first time (GitHub: Actions tab, run "nightly-bot" manually to start now).</p></div>';
  }
}
$('#refresh').onclick = () => { load(); pull(); };
document.addEventListener('visibilitychange', () => { if (!document.hidden) { load(); pull(); } });
paintLive();
paintChart();
load();
pull();
pullChart();
setInterval(pull, 5000);
setInterval(pullChart, 20000);
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
